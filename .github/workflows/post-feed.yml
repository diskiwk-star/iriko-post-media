name: post-feed (5:00 JST)

on:
  schedule:
    # GitHubの定時実行は混雑時に数時間遅れる（2026-08-13に約2時間20分の遅延を実測）。
    # 目標の5:00 JSTより早めに起動し、早すぎたら publish.py 側で5:00まで待つ。
    # 毎時ちょうどは特に混むので、分をずらしてある。予備を2本置き、
    # 先に投稿できた回の .done マーカーで二重投稿を防ぐ。
    - cron: '43 18 * * *'   # 18:43 UTC = 翌日 3:43 JST（本命・5:00まで待機）
    - cron: '43 19 * * *'   # 19:43 UTC = 翌日 4:43 JST（予備1）
    - cron: '43 20 * * *'   # 20:43 UTC = 翌日 5:43 JST（予備2・遅延時は即投稿）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（投稿せず内容表示のみ）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # 予備の実行が来たら、待機中の古い実行はキャンセルする。
  # （待機中の実行はまだ .done を書けないため、放置すると二重投稿になる）
  group: ig-post-feed
  cancel-in-progress: true

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to Instagram (feed slot)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          IG_ACCESS_TOKEN_KANONJI: ${{ secrets.IG_ACCESS_TOKEN_KANONJI }}
          IG_USER_ID_KANONJI: ${{ vars.IG_USER_ID_KANONJI }}
          SLOT: feed
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: python3 scripts/publish.py

      - name: Commit done marker
        run: |
          git config user.name "iriko-autopost-bot"
          git config user.email "actions@github.com"
          git add queue/*.done 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "feed posted $(date -u +%F)" && git push)
